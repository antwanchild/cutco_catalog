name: PR Preview

on:
  pull_request_target:
    types: [closed, unlabeled]

permissions:
  contents: read
  pull-requests: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  cleanup:
    name: Remove Preview Image
    concurrency:
      group: pr-docker-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'pull_request_target' &&
      (
        github.event.action == 'closed' ||
        github.event.action == 'unlabeled' && github.event.label.name == 'docker'
      )
    permissions:
      contents: read
      packages: write
    steps:
      - name: Delete preview image tag
        uses: actions/github-script@v9
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            if (pr.state === 'open' && pr.labels.some(label => label.name === 'docker')) {
              core.info('Preview is still requested; leaving it in place.');
              return;
            }
            const owner = context.repo.owner;
            const packageName = context.repo.repo;
            const prTagPrefix = `pr-${context.payload.pull_request.number}`;
            const versions = await github.paginate(
              "GET /users/{username}/packages/container/{package_name}/versions",
              {
                username: owner,
                package_name: packageName,
                per_page: 100,
              }
            );

            const matches = versions.filter((version) => {
              const tags = version?.metadata?.container?.tags || [];
              return tags.some((tag) => tag === prTagPrefix);
            });

            if (!matches.length) {
              core.info(`No GHCR versions found for ${prTagPrefix}. Nothing to delete.`);
              return;
            }

            for (const match of matches) {
              core.info(`Deleting GHCR version ${match.id} for ${prTagPrefix}.`);
              await github.request(
                "DELETE /users/{username}/packages/container/{package_name}/versions/{package_version_id}",
                {
                  username: owner,
                  package_name: packageName,
                  package_version_id: match.id,
                }
              );
            }
