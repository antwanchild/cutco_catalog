name: Release Notifications

on:
  workflow_run:
    # Both CI and Release run after a merge to master. Notify only for Release
    # so a single merge does not produce two identical build notifications.
    workflows: ["Release"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  notify:
    name: Notify Discord
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      contains(fromJSON('["success", "failure", "cancelled"]'), github.event.workflow_run.conclusion)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read published version
        id: version
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          version=$(git tag --points-at "$SOURCE_SHA" --list 'v[0-9]*' --sort=-version:refname | sed -n '1p')
          printf "value=%s\n" "$version" >> "$GITHUB_OUTPUT"

      - name: Send Discord result
        uses: ./.github/actions/discord-result
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          token: ${{ secrets.GITHUB_TOKEN }}
          project: Cutco Catalog
          event: Release
          result: ${{ github.event.workflow_run.conclusion }}
          sha: ${{ github.event.workflow_run.head_sha }}
          version: ${{ steps.version.outputs.value }}
          run-id: ${{ github.event.workflow_run.id }}
          run-attempt: ${{ github.event.workflow_run.run_attempt }}
