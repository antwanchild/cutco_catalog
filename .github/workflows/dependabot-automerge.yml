name: Dependabot Auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto-merge minor & patch
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'

    env:
      MERGE_APP_CONFIGURED: ${{ secrets.DEPENDABOT_MERGE_APP_CLIENT_ID != '' && secrets.DEPENDABOT_MERGE_APP_PRIVATE_KEY != '' }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub App merge token
        id: merge-token
        if: >
          env.MERGE_APP_CONFIGURED == 'true' &&
          (steps.meta.outputs.update-type != 'version-update:semver-major')
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.DEPENDABOT_MERGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPENDABOT_MERGE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Auto-merge non-major updates
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: |
          if [[ "$USING_MERGE_APP" != 'true' ]]; then
            echo '::warning::Configure the Dependabot merge app secrets to enable Discord alerts after auto-merges.'
          fi
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.merge-token.outputs.token || secrets.GITHUB_TOKEN }}
          USING_MERGE_APP: ${{ steps.merge-token.outcome == 'success' }}
