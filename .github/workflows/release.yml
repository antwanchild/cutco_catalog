name: Release

on:
  workflow_dispatch:
    inputs:
      repair_tag:
        description: "Existing release tag to rebuild, such as v1.105.0"
        required: false
        type: string
      repair_sha:
        description: "Commit SHA that the repair tag must reference"
        required: false
        type: string
  push:
    branches: [master]
    paths-ignore:
      - "**/*.md"

permissions:
  contents: write
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Auto-tag (runs on master push, derives version from commit message) ───
  auto-tag:
    name: Auto Tag
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
      version: ${{ steps.tag.outputs.version }}
      release_sha: ${{ steps.release_commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.repair_sha || github.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute next version and push tag
        id: tag
        env:
          REPAIR_TAG: ${{ inputs.repair_tag }}
          REPAIR_SHA: ${{ inputs.repair_sha }}
        run: |
          if [[ -n "$REPAIR_TAG" || -n "$REPAIR_SHA" ]]; then
            if [[ -z "$REPAIR_TAG" || -z "$REPAIR_SHA" ]]; then
              echo "repair_tag and repair_sha must be provided together." >&2
              exit 1
            fi
            if [[ ! "$REPAIR_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "repair_tag must be a semantic version tag such as v1.105.0." >&2
              exit 1
            fi

            git fetch --force origin "refs/tags/${REPAIR_TAG}:refs/tags/${REPAIR_TAG}"
            TAG_SHA=$(git rev-parse "${REPAIR_TAG}^{commit}")
            HEAD_SHA=$(git rev-parse HEAD)
            if [[ "$TAG_SHA" != "$HEAD_SHA" || "$HEAD_SHA" != "$REPAIR_SHA" ]]; then
              echo "Repair target mismatch: tag=${TAG_SHA} checkout=${HEAD_SHA} requested=${REPAIR_SHA}" >&2
              exit 1
            fi

            {
              echo "new_tag=${REPAIR_TAG}"
              echo "version=${REPAIR_TAG#v}"
              echo "rerun=true"
            } >> "$GITHUB_OUTPUT"
            {
              echo "## Release Repair"
              echo ""
              echo "- Existing tag: ${REPAIR_TAG}"
              echo "- Verified commit: ${HEAD_SHA}"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            bash scripts/release_tag.sh
          fi

      - name: Resolve release commit
        id: release_commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # ── Build & push (runs in same workflow as auto-tag, uses its outputs) ─────
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: auto-tag
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.auto-tag.outputs.new_tag }}

      - name: Extract version from tag
        id: version
        run: echo "version=${{ needs.auto-tag.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Extract short SHA
        id: sha
        env:
          RELEASE_SHA: ${{ needs.auto-tag.outputs.release_sha }}
        run: echo "short=${RELEASE_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest
            type=raw,value=sha-${{ steps.sha.outputs.short }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ needs.auto-tag.outputs.release_sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build release image for validation
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            GIT_SHA=${{ needs.auto-tag.outputs.release_sha }}

      - name: Verify fresh install and upgrade
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
          EXPECTED_SHA: ${{ needs.auto-tag.outputs.release_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
        run: |
          export SECRET_KEY
          SECRET_KEY="$(openssl rand -hex 32)"
          container=""
          volume=""
          cleanup() {
            if [[ -n "$container" ]]; then
              docker logs "$container"
              docker rm -f "$container"
            fi
            if [[ -n "$volume" ]]; then
              docker volume rm "$volume"
            fi
          }
          trap cleanup EXIT

          check_health() {
            container="$(docker run -d -p 127.0.0.1::8095 -e SECRET_KEY "$@" "$IMAGE")"
            local endpoint
            endpoint="$(docker port "$container" 8095/tcp)"
            for attempt in {1..30}; do
              echo "Checking release image health (attempt $attempt/30)"
              if curl --silent --fail --max-time 3 "http://$endpoint/health" |
                jq -e --arg version "$EXPECTED_VERSION" --arg sha "$EXPECTED_SHA" \
                  '.status == "ok" and .version == $version and .git_sha == $sha'; then
                return 0
              fi
              if [[ "$(docker inspect --format '{{.State.Running}}' "$container")" != 'true' ]]; then
                break
              fi
              sleep 2
            done
            echo "Container health or release metadata verification failed." >&2
            return 1
          }

          check_health
          docker rm -f "$container"
          container=""

          # Choose the highest published stable version below the candidate, including on repair runs.
          published_versions="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name |
              select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")) | ltrimstr("v")')"
          previous_version="$(printf '%s\n' "$published_versions" "$EXPECTED_VERSION" |
            sort -Vu | awk -v version="$EXPECTED_VERSION" '$0 == version { print previous } { previous = $0 }')"
          if [[ -z "$previous_version" ]]; then
            echo "::notice::No earlier stable release is available for an upgrade check."
            exit 0
          fi

          previous_image="$IMAGE_REPOSITORY:$previous_version"
          docker pull "$previous_image"
          volume="$(docker volume create)"
          docker run --rm -i -e SECRET_KEY -v "$volume:/data" "$previous_image" python - <<'PYTHON'
          from app import create_app
          from extensions import db
          from models import Item, ItemVariant, Ownership, Person

          with create_app().app_context():
              item = Item(name="Upgrade check knife", sku="CI-UPGRADE")
              variant = ItemVariant(item=item, color="Classic")
              person = Person(name="Upgrade check collector")
              db.session.add(Ownership(variant=variant, person=person, quantity_purchased=2))
              db.session.commit()
          PYTHON

          check_health -v "$volume:/data"
          docker exec -i "$container" python - <<'PYTHON'
          import sqlite3

          with sqlite3.connect("file:/data/cutco.db?mode=ro", uri=True) as db:
              rows = db.execute(
                  """
                  SELECT items.name, item_variants.color, people.name, ownership.quantity_purchased
                  FROM items
                  JOIN item_variants ON item_variants.item_id = items.id
                  JOIN ownership ON ownership.variant_id = item_variants.id
                  JOIN people ON people.id = ownership.person_id
                  WHERE items.sku = ?
                  """,
                  ("CI-UPGRADE",),
              ).fetchall()
          expected = [("Upgrade check knife", "Classic", "Upgrade check collector", 2)]
          if rows != expected:
              raise SystemExit(f"Upgrade did not preserve the sample collection: {rows!r}")
          print("Upgrade preserved the sample collection.")
          PYTHON

      - name: Scan the release image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_IMAGE_SRC: docker
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

      - name: Publish the validated image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            docker push "$tag"
          done <<< "$IMAGE_TAGS"

      - name: Extract curated release notes
        env:
          RELEASE_TAG: ${{ needs.auto-tag.outputs.new_tag }}
        run: |
          # Historical repair tags predate the curated changelog.
          if [ -f scripts/changelog.py ] && [ -f CHANGELOG.md ]; then
            python3 scripts/changelog.py notes "$RELEASE_TAG" --output "$RUNNER_TEMP/release-notes.md"
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.auto-tag.outputs.new_tag }}
        run: |
          notes_args=(--generate-notes)
          if [ -f "$RUNNER_TEMP/release-notes.md" ]; then
            notes_args=(--notes-file "$RUNNER_TEMP/release-notes.md")
          fi
          for attempt in 1 2 3 4 5; do
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              echo "Release ${RELEASE_TAG} already exists."
              exit 0
            fi

            if output=$(gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "$RELEASE_TAG" \
              "${notes_args[@]}" 2>&1); then
              echo "$output"
              exit 0
            fi

            if [[ "$output" == *"Release.tag_name already exists"* ]]; then
              echo "Release ${RELEASE_TAG} already exists."
              exit 0
            fi

            echo "Release API attempt ${attempt} failed: ${output}" >&2
            if [[ "$attempt" -lt 5 ]]; then
              sleep $((attempt * 5))
            fi
          done

          echo "Could not create or verify release ${RELEASE_TAG}." >&2
          exit 1

  notify-manual-release:
    name: Notify Discord of manual release
    if: always() && github.event_name == 'workflow_dispatch'
    needs: [auto-tag, build]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Send Discord result
        uses: ./.github/actions/discord-result
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          token: ${{ secrets.GITHUB_TOKEN }}
          project: Cutco Catalog
          event: Release
          result: ${{ contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'cancelled') && 'cancelled' || needs.build.result }}
          sha: ${{ needs.auto-tag.outputs.release_sha || github.sha }}
          version: ${{ needs.auto-tag.outputs.new_tag }}
          release-tag: ${{ needs.auto-tag.outputs.new_tag }}
          image: ghcr.io/${{ github.repository }}:latest
