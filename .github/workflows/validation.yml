name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [master]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHON_VERSION: "3.13"
  IMAGE_NAME: ghcr.io/${{ github.repository }}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────────────────────
# Testing & Quality Gates
#
# Runs on every PR targeting master and on push to master.
#
# Checks, roughly in order of speed:
#   1. lint       - Ruff, Black, and Pyright on the full tree
#   2. smoke      - core end-to-end checks for public, admin, MSRP, errors, and utilities
#   3. imports    - CSV import feature checks
#   4. perf       - timing report from the main test run
#   5. tests      - the main unit suite on Ubuntu
#   6. coverage   - repository coverage thresholds and report generation
#   7. security   - secret and filesystem vulnerability scanning
#
# The Windows jobs (`smoke` and `imports`) catch OS-specific regressions.
# Windows stays on the smaller subsets where it is most valuable, while the
# full suite runs on Ubuntu to keep PR latency down.
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  # ── Lint ─────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: ${{ runner.os }}-pip-lint-

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff check
        run: ruff check .

      - name: Black check
        run: black --check .

      - name: Pyright
        run: pyright

  # ── Smoke ────────────────────────────────────────────────────────────────
  # Quick end-to-end checks that prove the CLI still boots and the common
  # happy-path flows still behave as expected.
  #
  # File split:
  #   public   - landing, auth redirects, search, variants, and health
  #   admin    - admin auth, diagnostics, audit, and wishlist checks
  #   msrp     - scraper and price-resolution logic
  #   errors   - permission, rate-limit, and payload-size guards
  #   utilities - helper functions and time formatting
  smoke:
    name: Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-smoke-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: ${{ runner.os }}-pip-smoke-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run smoke tests
        run: |
          python -m unittest discover -s tests -p 'test_smoke_public.py'
          python -m unittest discover -s tests -p 'test_smoke_admin.py'
          python -m unittest discover -s tests -p 'test_smoke_msrp.py'
          python -m unittest discover -s tests -p 'test_smoke_errors.py'
          python -m unittest discover -s tests -p 'test_smoke_utilities.py'

  # ── Imports ──────────────────────────────────────────────────────────────
  # Exercises CSV import validation and confirmation on Windows.
  imports:
    name: Imports (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-imports-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: ${{ runner.os }}-pip-imports-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run import tests
        env:
          ADMIN_TOKEN: test-admin-token
          SECRET_KEY: test-secret-key
        run: python -m unittest discover -s tests -p 'test_smoke_import.py'

  # ── Perf ─────────────────────────────────────────────────────────────────
  # Reuses timings from Tests instead of running the full suite again.
  perf:
    name: Perf
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: test-reports

      - name: Show performance timing
        run: cat test-timings.txt

  # ── Tests ────────────────────────────────────────────────────────────────
  # Main unit suite. This is the broad safety net for the codebase.
  tests:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-tests-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: ${{ runner.os }}-pip-tests-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt coverage

      - name: Run unit tests
        env:
          ADMIN_TOKEN: test-admin-token
          SECRET_KEY: test-secret-key
        run: coverage run -m scripts.run_tests

      - name: Generate coverage XML
        if: ${{ always() && hashFiles('.coverage') != '' }}
        run: coverage xml -o coverage.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          include-hidden-files: true
          path: |
            .coverage
            coverage.xml
            test-timings.txt

  # ── Coverage ─────────────────────────────────────────────────────────────
  # Generates the coverage report and enforces the repository threshold.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [tests]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install coverage
        run: python -m pip install coverage

      - name: Download test reports
        uses: actions/download-artifact@v8
        with:
          name: test-reports

      - name: Check coverage
        run: |
          coverage report \
            --include='app.py,blueprints/admin.py,constants.py,extensions.py,helpers.py,models.py,schema_migrations.py,startup.py' \
            --show-missing
          coverage report \
            --include='blueprints/catalog.py,blueprints/data.py,blueprints/logs.py,blueprints/people.py,blueprints/views.py' \
            --show-missing
          coverage report \
            --include='app.py,blueprints/admin.py,constants.py,extensions.py,helpers.py,models.py,schema_migrations.py,startup.py' \
            --fail-under=80 \
            --show-missing

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml

  # ── Security scans ────────────────────────────────────────────────────────
  # Runs after the test and coverage jobs so it only evaluates trusted code.
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [tests, coverage, smoke, imports, perf]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks - secret scan
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy - filesystem CVE scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: true

  preview:
    needs: security
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'docker')
    name: Build Preview Image
    concurrency:
      group: pr-docker-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: read
    steps:
      - name: Resolve PR context
        id: preview_meta
        uses: actions/github-script@v9
        with:
          script: |
            const requiredLabel = "docker";
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            if (pullRequest.state !== 'open' || pullRequest.head.sha !== context.payload.pull_request.head.sha) {
              core.info('This PR is closed or has newer commits; skipping the stale preview.');
              core.setOutput('ready', 'false');
              return;
            }

            if (!pullRequest) {
              core.setFailed("This preview event is not associated with a pull request.");
              return;
            }

            const previewTagPrefix = `pr-${pullRequest.number}`;

            const labels = pullRequest.labels || [];
            if (!labels.some((label) => label.name === requiredLabel)) {
              core.info(`PR #${pullRequest.number} does not have the '${requiredLabel}' label. Skipping the image build.`);
              core.setOutput("ready", "false");
              return;
            }

            const canPublishPreviewImage = pullRequest.head.repo.full_name === `${context.repo.owner}/${context.repo.repo}`;
            const previewBuildNumber = Number(process.env.GITHUB_RUN_NUMBER || "1");

            core.setOutput("ready", "true");
            core.setOutput("pr_number", String(pullRequest.number));
            core.setOutput("head_sha", pullRequest.head.sha);
            core.setOutput("build_number", String(previewBuildNumber));
            core.setOutput("version", previewTagPrefix);
            core.setOutput("pr_tag", previewTagPrefix);
            core.setOutput("can_push", String(canPublishPreviewImage));

      - name: Checkout PR head
        if: steps.preview_meta.outputs.ready == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.preview_meta.outputs.head_sha }}

      - name: Log in to GHCR
        if: steps.preview_meta.outputs.ready == 'true' && steps.preview_meta.outputs.can_push == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build preview image
        if: steps.preview_meta.outputs.ready == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ steps.preview_meta.outputs.can_push == 'true' }}
          load: ${{ steps.preview_meta.outputs.can_push != 'true' }}
          tags: ${{ env.IMAGE_NAME }}:${{ steps.preview_meta.outputs.pr_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.documentation=${{ github.server_url }}/${{ github.repository }}#readme
            org.opencontainers.image.revision=${{ steps.preview_meta.outputs.head_sha }}
            org.opencontainers.image.version=${{ steps.preview_meta.outputs.version }}.${{ steps.preview_meta.outputs.build_number }}
            org.opencontainers.image.ref.name=${{ steps.preview_meta.outputs.pr_tag }}
            org.opencontainers.image.licenses=MIT
            com.cutco.preview.build-number=${{ steps.preview_meta.outputs.build_number }}
            com.cutco.preview.pr-number=${{ steps.preview_meta.outputs.pr_number }}
          build-args: |
            APP_VERSION=${{ steps.preview_meta.outputs.version }}.${{ steps.preview_meta.outputs.build_number }}
            PR_BUILD_NUMBER=${{ steps.preview_meta.outputs.build_number }}
            GIT_SHA=${{ steps.preview_meta.outputs.head_sha }}
